# Fluentd L2: Multi-output routing to Elasticsearch and S3
# Requires plugins: fluent-plugin-elasticsearch, fluent-plugin-s3
# Install: gem install fluent-plugin-elasticsearch fluent-plugin-s3

<system>
  log_level info
  suppress_repeated_stacktrace true
</system>

# --- INPUTS ---

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type tail
  path /var/log/containers/*.log
  pos_file /var/log/fluentd/containers.log.pos
  tag docker.*
  read_from_head false
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

# --- FILTERS ---

<filter docker.**>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    tag ${tag}
  </record>
</filter>

# Detect log level from message content
<filter **>
  @type grep
  <regexp>
    key message
    pattern /.+/
  </regexp>
</filter>

# --- ROUTING & OUTPUT ---

# Route error logs to dedicated error index in ES
<match **.error>
  @type elasticsearch
  host "#{ENV['ES_HOST'] || 'elasticsearch'}"
  port "#{ENV['ES_PORT'] || 9200}"
  user "#{ENV['ES_USER'] || 'elastic'}"
  password "#{ENV['ES_PASSWORD'] || ENV['ES_PASSWORD']}"
  logstash_format true
  logstash_prefix errors
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  tag_key @log_name
  reconnect_on_error true
  reload_on_failure true
  request_timeout 30s
  <buffer>
    @type file
    path /var/log/fluentd/buffer/es-errors
    flush_interval 10s
    chunk_limit_size 8MB
    retry_max_times 10
  </buffer>
</match>

# Send all logs to Elasticsearch (primary output)
<match **>
  @type copy

  # Output 1: Elasticsearch
  <store>
    @type elasticsearch
    host "#{ENV['ES_HOST'] || 'elasticsearch'}"
    port "#{ENV['ES_PORT'] || 9200}"
    user "#{ENV['ES_USER'] || 'elastic'}"
    password "#{ENV['ES_PASSWORD'] || ENV['ES_PASSWORD']}"
    logstash_format true
    logstash_prefix logs
    logstash_dateformat %Y.%m.%d
    include_tag_key true
    tag_key @log_name
    reconnect_on_error true
    reload_on_failure true
    request_timeout 30s
    <buffer>
      @type file
      path /var/log/fluentd/buffer/es-all
      flush_mode interval
      flush_interval 10s
      chunk_limit_size 16MB
      total_limit_size 1GB
      retry_max_interval 60s
      retry_max_times 17
    </buffer>
  </store>

  # Output 2: S3 for long-term archival
  <store>
    @type s3
    aws_key_id "#{ENV['AWS_ACCESS_KEY_ID']}"
    aws_sec_key "#{ENV['AWS_SECRET_ACCESS_KEY']}"
    s3_bucket "#{ENV['S3_BUCKET'] || 'my-logs-archive'}"
    s3_region "#{ENV['AWS_REGION'] || 'us-east-1'}"
    s3_object_key_format %{path}%{time_slice}_%{index}.%{file_extension}
    path logs/%Y/%m/%d/
    store_as gzip
    time_slice_format %Y%m%d%H
    utc true
    <format>
      @type json
    </format>
    <buffer time>
      @type file
      path /var/log/fluentd/buffer/s3
      timekey 3600          # 1-hour chunks
      timekey_wait 10m      # wait 10min after hour ends before flushing
      chunk_limit_size 256MB
      total_limit_size 4GB
    </buffer>
  </store>
</match>
