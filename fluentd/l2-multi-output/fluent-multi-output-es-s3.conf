# Fluentd L2: Aggregator with multi-output routing to Elasticsearch and S3
# Receives (forward, shared-key authenticated) from Fluent Bit / Fluentd edge agents.
# Plugins (installed by ../Dockerfile): fluent-plugin-elasticsearch, fluent-plugin-s3,
#                                       fluent-plugin-rewrite-tag-filter
# Environment: FLUENT_SHARED_KEY, ES_HOST, ES_PORT, ES_USER, ELASTIC_PASSWORD,
#              S3_BUCKET, AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Validate: fluentd --dry-run -c fluent-multi-output-es-s3.conf

<system>
  log_level info
  suppress_repeated_stacktrace true
</system>

# --- INPUTS ---

<source>
  @type forward
  port 24224
  bind 0.0.0.0
  <security>
    self_hostname "#{Socket.gethostname}"
    shared_key "#{ENV['FLUENT_SHARED_KEY']}"
  </security>
</source>

# --- FILTERS ---

<filter docker.**>
  @type record_transformer
  <record>
    aggregator "#{Socket.gethostname}"
  </record>
</filter>

# Records whose `log` text looks like an error get the tag prefix `error.`
# so the next <match> can send them to a dedicated index.
<match docker.**>
  @type rewrite_tag_filter
  <rule>
    key log
    pattern /(error|exception|fatal)/i
    tag error.${tag}
  </rule>
  <rule>
    key log
    pattern /(error|exception|fatal)/i
    invert true
    tag normal.${tag}
  </rule>
</match>

# --- ROUTING & OUTPUT ---

# Errors: dedicated index fluentd-errors-YYYY.MM.DD
<match error.**>
  @type elasticsearch
  host "#{ENV['ES_HOST'] || 'elasticsearch'}"
  port "#{ENV['ES_PORT'] || 9200}"
  user "#{ENV['ES_USER'] || 'elastic'}"
  password "#{ENV['ELASTIC_PASSWORD']}"
  logstash_format true
  logstash_prefix fluentd-errors
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  tag_key @log_name
  suppress_type_name true
  reconnect_on_error true
  reload_on_failure true
  request_timeout 30s
  <buffer>
    @type file
    path /var/log/fluentd/buffer/es-errors
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 8MB
    retry_max_times 10
  </buffer>
</match>

# Everything else: Elasticsearch (primary) + S3 (long-term archive)
<match normal.**>
  @type copy

  # Output 1: Elasticsearch
  <store>
    @type elasticsearch
    host "#{ENV['ES_HOST'] || 'elasticsearch'}"
    port "#{ENV['ES_PORT'] || 9200}"
    user "#{ENV['ES_USER'] || 'elastic'}"
    password "#{ENV['ELASTIC_PASSWORD']}"
    logstash_format true
    logstash_prefix fluentd
    logstash_dateformat %Y.%m.%d
    include_tag_key true
    tag_key @log_name
    suppress_type_name true
    reconnect_on_error true
    reload_on_failure true
    request_timeout 30s
    <buffer>
      @type file
      path /var/log/fluentd/buffer/es-all
      flush_mode interval
      flush_interval 5s
      chunk_limit_size 16MB
      total_limit_size 1GB
      retry_max_interval 60s
      retry_max_times 17
    </buffer>
  </store>

  # Output 2: S3 for long-term archival. check_bucket/check_object are off so the
  # aggregator can start without AWS access; with real credentials turn them back on.
  <store>
    @type s3
    aws_key_id "#{ENV['AWS_ACCESS_KEY_ID']}"
    aws_sec_key "#{ENV['AWS_SECRET_ACCESS_KEY']}"
    s3_bucket "#{ENV['S3_BUCKET'] || 'my-logs-archive'}"
    s3_region "#{ENV['AWS_REGION'] || 'us-east-1'}"
    check_bucket false
    check_object false
    s3_object_key_format %{path}%{time_slice}_%{index}.%{file_extension}
    path logs/%Y/%m/%d/
    store_as gzip
    time_slice_format %Y%m%d%H
    utc true
    <format>
      @type json
    </format>
    <buffer time>
      @type file
      path /var/log/fluentd/buffer/s3
      timekey 3600          # 1-hour chunks
      timekey_wait 10m      # wait 10min after hour ends before flushing
      chunk_limit_size 256MB
      total_limit_size 4GB
    </buffer>
  </store>
</match>
