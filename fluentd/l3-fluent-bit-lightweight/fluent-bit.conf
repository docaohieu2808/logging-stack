# Fluent Bit L3: Lightweight log collector (edge/node agent)
# Use case: DaemonSet on Kubernetes nodes or sidecar container
# Forwards to: Fluentd aggregator or directly to Elasticsearch
# Docs: https://docs.fluentbit.io/manual

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    storage.metrics on
    storage.path  /var/log/fluentbit/storage
    storage.sync  normal
    storage.checksum off
    storage.backlog.mem_limit 50M

# --- INPUTS ---

# Tail Docker container log files (JSON format)
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    multiline.parser  docker, cri
    Tag               docker.*
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    DB                /var/log/fluentbit/docker-tail.db
    DB.Sync           Normal
    Refresh_Interval  10

# Collect node systemd/journal logs
[INPUT]
    Name            systemd
    Tag             systemd.*
    Systemd_Filter  _SYSTEMD_UNIT=docker.service
    Systemd_Filter  _SYSTEMD_UNIT=kubelet.service
    Read_From_Tail  On
    Strip_Underscores On

# CPU and memory metrics (optional)
[INPUT]
    Name          cpu
    Tag           metrics.cpu
    Interval_Sec  30

# --- FILTERS ---

# Parse Kubernetes metadata from Docker log path
[FILTER]
    Name                kubernetes
    Match               docker.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     docker.var.lib.docker.containers.
    Merge_Log           On
    Merge_Log_Key       log_processed
    K8S-Logging.Parser  On
    K8S-Logging.Exclude Off
    Annotations         Off
    Labels              On

# Add static fields
[FILTER]
    Name    record_modifier
    Match   *
    Record  hostname ${HOSTNAME}
    Record  collector fluent-bit

# Drop health check noise
[FILTER]
    Name   grep
    Match  docker.*
    Exclude log /^.*health.*check.*$/i

# --- OUTPUTS ---

# Forward to Fluentd aggregator (recommended pattern)
[OUTPUT]
    Name          forward
    Match         docker.*
    Host          fluentd-aggregator
    Port          24224
    Shared_Key    fluentd-shared-key
    Self_Hostname ${HOSTNAME}
    tls           off
    Retry_Limit   5

# Directly to Elasticsearch (alternative, comment out forward above)
# [OUTPUT]
#     Name              es
#     Match             docker.*
#     Host              elasticsearch
#     Port              9200
#     HTTP_User         elastic
#     HTTP_Passwd       changeme
#     Logstash_Format   On
#     Logstash_Prefix   fluent-bit
#     Logstash_DateFormat %Y.%m.%d
#     Replace_Dots      On
#     Retry_Limit       5
#     tls               off
#     Suppress_Type_Name On

# Send systemd logs to separate ES index
[OUTPUT]
    Name          forward
    Match         systemd.*
    Host          fluentd-aggregator
    Port          24224
    Shared_Key    fluentd-shared-key
    Self_Hostname ${HOSTNAME}

# Metrics to stdout for debugging
[OUTPUT]
    Name   stdout
    Match  metrics.*
    Format json_lines
