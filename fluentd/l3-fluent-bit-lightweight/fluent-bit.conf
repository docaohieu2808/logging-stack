# Fluent Bit L3: Lightweight log collector (edge/node agent)
# Use case: agent on a Docker host or sidecar container; Fluent Bit is the maintained,
# low-footprint (C, ~1 MB RAM idle) successor to running Fluentd on every node.
# Forwards to: the Fluentd aggregator (l2) or directly to Elasticsearch.
# Docs: https://docs.fluentbit.io/manual
# Validate: fluent-bit -c fluent-bit.conf --dry-run
# Environment: HOSTNAME, FLUENT_SHARED_KEY (must equal the aggregator's shared_key)

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    storage.metrics on
    storage.path  /var/log/fluentbit/storage
    storage.sync  normal
    storage.checksum off
    storage.backlog.mem_limit 50M

# --- INPUTS ---

# Tail Docker container log files (json-file driver format)
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    multiline.parser  docker, cri
    Tag               docker.*
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    DB                /var/log/fluentbit/docker-tail.db
    DB.Sync           Normal
    Refresh_Interval  10

# Host journal (needs /var/log/journal mounted into the container; enable on a real host)
# [INPUT]
#     Name              systemd
#     Tag               systemd.*
#     Systemd_Filter    _SYSTEMD_UNIT=docker.service
#     Read_From_Tail    On
#     Strip_Underscores On

# CPU metrics for the agent host (optional)
[INPUT]
    Name          cpu
    Tag           metrics.cpu
    Interval_Sec  30

# --- FILTERS ---

# Add static fields
[FILTER]
    Name    record_modifier
    Match   docker.*
    Record  hostname ${HOSTNAME}
    Record  collector fluent-bit

# Drop health check noise (grep takes a plain regex, no /.../i delimiters)
[FILTER]
    Name   grep
    Match  docker.*
    Exclude log (?i)health.?check

# --- OUTPUTS ---

# Forward to the Fluentd aggregator (recommended pattern)
[OUTPUT]
    Name          forward
    Match         docker.*
    Host          ${FLUENTD_HOST}
    Port          24224
    Shared_Key    ${FLUENT_SHARED_KEY}
    Self_Hostname ${HOSTNAME}
    tls           off
    Retry_Limit   5

# Directly to Elasticsearch instead (comment out the forward output above)
# [OUTPUT]
#     Name                es
#     Match               docker.*
#     Host                ${ES_HOST}
#     Port                9200
#     HTTP_User           elastic
#     HTTP_Passwd         ${ELASTIC_PASSWORD}
#     Logstash_Format     On
#     Logstash_Prefix     fluent-bit
#     Replace_Dots        On
#     Suppress_Type_Name  On
#     Retry_Limit         5
#     tls                 off

# Agent metrics to stdout for debugging
[OUTPUT]
    Name   stdout
    Match  metrics.*
    Format json_lines
