# Fluentd L1: Basic log collection and forwarding
# Collects: syslog (UDP 5140), Docker container logs, application logs
# Forwards: to the downstream Fluentd aggregator (l2)
# Environment: FLUENT_SHARED_KEY (required, must match the aggregator), AGGREGATOR_HOST (optional)
# Validate: fluentd --dry-run -c fluent.conf

<system>
  log_level info
  suppress_repeated_stacktrace true
  emit_error_log_interval 60s
</system>

# --- INPUTS ---

# Collect Docker container logs via Docker logging driver
<source>
  @type forward
  port 24224
  bind 0.0.0.0
  <security>
    self_hostname "#{Socket.gethostname}"
    shared_key "#{ENV['FLUENT_SHARED_KEY']}"
  </security>
</source>

# Collect syslog over UDP
<source>
  @type syslog
  port 5140
  bind 0.0.0.0
  tag syslog
  <parse>
    @type syslog
    with_priority true
  </parse>
</source>

# Tail application log files
<source>
  @type tail
  path /var/log/app/*.log
  pos_file /var/log/fluentd/app.log.pos
  tag app.log
  read_from_head true
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
    keep_time_key false
  </parse>
</source>

# --- FILTERS ---

# Add hostname and environment metadata to all records
<filter **>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    environment "#{ENV['ENVIRONMENT'] || 'production'}"
    log_collected_at ${time}
  </record>
</filter>

# Parse JSON messages that arrive as strings
<filter app.**>
  @type parser
  key_name message
  reserve_data true
  remove_key_name_field false
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# --- OUTPUT ---

# Forward everything to aggregator
<match **>
  @type forward
  send_timeout 60s
  recover_wait 10s
  hard_timeout 120s
  <security>
    self_hostname "#{Socket.gethostname}"
    shared_key "#{ENV['FLUENT_SHARED_KEY']}"
  </security>
  <server>
    name aggregator
    host "#{ENV['AGGREGATOR_HOST'] || 'fluentd-aggregator'}"
    port 24224
    weight 60
  </server>
  <buffer>
    @type file
    path /var/log/fluentd/buffer/forward
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 8MB
    total_limit_size 512MB
    retry_max_interval 30s
    retry_forever false
    retry_max_times 17
  </buffer>
</match>
