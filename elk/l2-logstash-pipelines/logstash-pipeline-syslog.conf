input {
  tcp {
    port => 5140
    type => "syslog"
  }
  udp {
    port => 5140
    type => "syslog"
  }
}

filter {
  if [type] == "syslog" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}"
      }
      add_field => ["received_at", "%{@timestamp}"]
      add_field => ["received_from", "%{host}"]
    }

    date {
      match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      timezone => "UTC"
    }

    mutate {
      remove_field => ["message"]
      add_tag => ["syslog"]
    }

    # Map syslog severity to log level
    if [syslog_program] =~ /kernel/ {
      mutate { add_tag => ["kernel"] }
    }
  }
}

output {
  if [type] == "syslog" {
    # Data stream logs-syslog-default; ILM comes from the index template created by
    # elk/l3-index-lifecycle-management/apply-ilm.sh (policy logs-30day-retention).
    elasticsearch {
      hosts => ["http://${ES_HOST:elasticsearch}:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "syslog"
      data_stream_namespace => "default"
    }
  }

  # Debug: uncomment to see events in logstash logs
  # stdout { codec => rubydebug }
}
