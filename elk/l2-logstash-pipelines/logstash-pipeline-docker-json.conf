input {
  # Collect Docker container logs via Filebeat or direct file input
  beats {
    port => 5044
    type => "docker"
  }

  # Alternatively read Docker JSON log files directly
  file {
    path => "/var/lib/docker/containers/**/*-json.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/.sincedb_docker"
    codec => "json"
    type => "docker-file"
    tags => ["docker", "container"]
  }
}

filter {
  # Parse Docker JSON log format
  if [type] == "docker" or [type] == "docker-file" {
    # Docker JSON log format: {"log":"...\n","stream":"stdout","time":"..."}
    if [log] {
      mutate {
        rename => { "log" => "message" }
      }
      mutate {
        strip => ["message"]
      }
    }

    # Try to parse message as JSON (for structured app logs)
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }

    if [parsed] {
      mutate {
        merge => { "@fields" => "parsed" }
      }
      # Promote common fields
      if [parsed][level] {
        mutate { rename => { "[parsed][level]" => "log_level" } }
      }
      if [parsed][msg] {
        mutate { rename => { "[parsed][msg]" => "message" } }
      }
      if [parsed][timestamp] {
        date {
          match => ["[parsed][timestamp]", "ISO8601"]
          target => "@timestamp"
        }
      }
      mutate { remove_field => ["parsed"] }
    }

    # Extract container metadata from path for file input
    if [type] == "docker-file" and [path] {
      grok {
        match => { "path" => "/var/lib/docker/containers/%{DATA:container_id}/" }
        tag_on_failure => []
      }
    }

    # Normalize log level field
    if [log_level] {
      mutate {
        lowercase => ["log_level"]
      }
    }

    # Add stream field default
    if ![stream] {
      mutate { add_field => { "stream" => "stdout" } }
    }

    mutate {
      add_field => { "ingest_pipeline" => "logstash-docker-json" }
    }
  }
}

output {
  if [type] == "docker" or [type] == "docker-file" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index => "docker-logs-%{+YYYY.MM.dd}"
      ilm_enabled => true
      ilm_rollover_alias => "docker-logs"
      ilm_policy => "logs-30day-retention"
      template_name => "docker-logs"
      template_overwrite => false
    }
  }

  # stdout { codec => rubydebug }
}
