input {
  # Collect Docker container logs via Filebeat or direct file input
  beats {
    port => 5044
    type => "docker"
  }

  # Alternatively read Docker json-file logs directly. The compose file mounts
  # sample-logs/docker-json here; on a real host mount /var/lib/docker/containers
  # (readable by the logstash user) and use "/var/log/docker-json/*/*-json.log".
  file {
    path => "/var/log/docker-json/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/.sincedb_docker"
    codec => "json"
    type => "docker-file"
    tags => ["docker", "container"]
  }
}

filter {
  # Parse Docker JSON log format
  if [type] == "docker" or [type] == "docker-file" {
    # Docker JSON log format: {"log":"...\n","stream":"stdout","time":"..."}
    if [log] {
      mutate {
        rename => { "log" => "message" }
      }
      mutate {
        strip => ["message"]
      }
    }

    # Try to parse message as JSON (for structured app logs)
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }

    if [parsed] {
      # Promote common fields
      if [parsed][level] {
        mutate { rename => { "[parsed][level]" => "log_level" } }
      }
      if [parsed][msg] {
        mutate { rename => { "[parsed][msg]" => "message" } }
      }
      if [parsed][timestamp] {
        date {
          match => ["[parsed][timestamp]", "ISO8601"]
          target => "@timestamp"
        }
      }
      mutate { remove_field => ["parsed"] }
    }

    # Extract container metadata from path for file input
    # (ECS compatibility is on by default in Logstash 8: the file path lives in [log][file][path])
    if [type] == "docker-file" and [log][file][path] {
      grok {
        match => { "[log][file][path]" => "%{GREEDYDATA}/%{DATA:container_id}-json\.log$" }
        tag_on_failure => []
      }
    }

    # Normalize log level field
    if [log_level] {
      mutate {
        lowercase => ["log_level"]
      }
    }

    # Add stream field default
    if ![stream] {
      mutate { add_field => { "stream" => "stdout" } }
    }

    mutate {
      add_field => { "ingest_pipeline" => "logstash-docker-json" }
    }
  }
}

output {
  if [type] == "docker" or [type] == "docker-file" {
    # Data stream logs-docker-default; ILM comes from the index template created by
    # elk/l3-index-lifecycle-management/apply-ilm.sh (policy logs-30day-retention).
    elasticsearch {
      hosts => ["http://${ES_HOST:elasticsearch}:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "docker"
      data_stream_namespace => "default"
    }
  }

  # stdout { codec => rubydebug }
}
