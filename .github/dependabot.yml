version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /fluentd
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /elk/l1-basic-elasticsearch-kibana
    schedule:
      interval: weekly
    ignore:
      # Elasticsearch, Kibana and Logstash must move to a new major together: do it by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /elk/l2-logstash-pipelines
    schedule:
      interval: weekly
    ignore:
      # Elasticsearch, Kibana and Logstash must move to a new major together: do it by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /elk/l4-elasticsearch-cluster
    schedule:
      interval: weekly
    ignore:
      # Elasticsearch, Kibana and Logstash must move to a new major together: do it by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
