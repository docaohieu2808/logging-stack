# Full logging stack: Elasticsearch + Kibana + Logstash (via the ELK l1/l2 compose files)
# plus Fluent Bit -> Fluentd aggregator and a Vector aggregator, all writing to ONE
# single-node Elasticsearch (heap 512 MB, ~4 GB RAM total).
#
#   cp .env.example .env
#   docker compose --env-file .env -f docker-compose-full-logging.yml up -d --wait
#   ./scripts/smoke-test.sh          # sends one line through every shipper and finds it in ES
#
# Optional Prometheus + Grafana for pipeline metrics:  add  --profile metrics
#
# Data paths:
#   Logstash   syslog TCP/UDP :5140, Beats :5044, sample-logs/docker-json/*.log -> logs-syslog-default, logs-docker-default
#   Fluent Bit tails Docker json-file logs -> Fluentd :24224 (shared key) -> fluentd-* / fluentd-errors-* indices
#   Vector     HTTP :8080/ingest, Vector :9000, syslog UDP :5140 (inside the network) -> logs-aggregated-<env> data stream

include:
  - elk/l2-logstash-pipelines/docker-compose-logstash.yml

services:
  # ── Fluentd aggregator (receives from Fluent Bit) ──────────────────────────
  fluentd:
    build:
      context: ./fluentd
      dockerfile: Dockerfile
    image: logging-stack/fluentd:1.20.1
    container_name: fluentd-aggregator
    environment:
      FLUENT_SHARED_KEY: ${FLUENT_SHARED_KEY:?copy .env.example to .env}
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      ES_USER: elastic
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?copy .env.example to .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-my-logs-archive}
    volumes:
      - ./fluentd/l2-multi-output/fluent-multi-output-es-s3.conf:/fluentd/etc/fluent.conf:ro
      - fluentd_buffer:/var/log/fluentd/buffer
    ports:
      - "24224:24224"
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/24224'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── Fluent Bit edge collector (Docker json-file logs -> Fluentd) ───────────
  fluent-bit:
    image: fluent/fluent-bit:5.1.5
    container_name: fluent-bit
    environment:
      HOSTNAME: fluent-bit-agent
      FLUENTD_HOST: fluentd-aggregator
      FLUENT_SHARED_KEY: ${FLUENT_SHARED_KEY:?copy .env.example to .env}
    volumes:
      - ./fluentd/l3-fluent-bit-lightweight/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent_bit_db:/var/log/fluentbit
    ports:
      - "2020:2020"       # Fluent Bit HTTP monitoring + Prometheus metrics
    networks:
      - elk
    depends_on:
      fluentd:
        condition: service_healthy

  # ── Vector aggregator ──────────────────────────────────────────────────────
  vector:
    image: timberio/vector:0.60.0-alpine
    container_name: vector-aggregator
    command: ["--config", "/etc/vector/vector.toml"]
    environment:
      # Vector 0.60+ only expands ${VAR} in config files when this is true.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      ES_HOST: elasticsearch
      ES_USER: elastic
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?copy .env.example to .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-logs-archive}
      ENVIRONMENT: ${ENVIRONMENT:-lab}
    volumes:
      - ./vector/l3-vector-aggregator/vector-aggregator-multi-source.toml:/etc/vector/vector.toml:ro
      - vector_data:/var/lib/vector
    ports:
      - "9000:9000"       # Vector-to-Vector source
      - "8080:8080"       # HTTP ingest
      - "9598:9598"       # Prometheus metrics
      - "8686:8686"       # Vector API
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8686/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── Optional: Prometheus + Grafana for pipeline metrics (--profile metrics) ─
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    profiles: [metrics]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - elk

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    profiles: [metrics]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?copy .env.example to .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - elk
    depends_on:
      - prometheus

volumes:
  fluentd_buffer:
  fluent_bit_db:
  vector_data:
  prometheus_data:
  grafana_data:

configs:
  # Elasticsearch and Logstash do not expose Prometheus-format metrics natively
  # (that needs elasticsearch_exporter), so only the two shippers that do are scraped.
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: vector
          static_configs:
            - targets: ["vector-aggregator:9598"]
        - job_name: fluent-bit
          metrics_path: /api/v2/metrics/prometheus
          static_configs:
            - targets: ["fluent-bit:2020"]
